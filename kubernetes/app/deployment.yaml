apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: flask-demo
    app.kubernetes.io/part-of: eks-argocd-gitops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-demo
        app.kubernetes.io/part-of: eks-argocd-gitops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-demo
          image: ghcr.io/pratik-torkad/flask-cicd-demo:sha-609d81a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
